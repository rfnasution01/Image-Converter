<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#F8FAFC"/><text x="80" y="120" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#2563EB">HOW IT WORKS</text><text x="80" y="230" font-family="Arial,sans-serif" font-size="70" font-weight="700" fill="#0F172A">Three steps.</text><text x="80" y="310" font-family="Arial,sans-serif" font-size="70" font-weight="700" fill="#2563EB">That’s it.</text><g font-family="Arial,sans-serif"><rect x="80" y="430" width="920" height="130" rx="22" fill="white" stroke="#E2E8F0" stroke-width="3"/><circle cx="150" cy="495" r="37" fill="#DBEAFE"/><text x="138" y="507" font-size="34" font-weight="700" fill="#2563EB">1</text><text x="225" y="485" font-size="29" font-weight="700" fill="#0F172A">Choose your images</text><text x="225" y="525" font-size="23" fill="#64748B">Select or drop your files.</text><rect x="80" y="590" width="920" height="130" rx="22" fill="white" stroke="#E2E8F0" stroke-width="3"/><circle cx="150" cy="655" r="37" fill="#DBEAFE"/><text x="138" y="667" font-size="34" font-weight="700" fill="#2563EB">2</text><text x="225" y="645" font-size="29" font-weight="700" fill="#0F172A">Pick a format</text><text x="225" y="685" font-size="23" fill="#64748B">JPG, PNG, WebP, or AVIF.</text><rect x="80" y="750" width="920" height="130" rx="22" fill="white" stroke="#E2E8F0" stroke-width="3"/><circle cx="150" cy="815" r="37" fill="#D1FAE5"/><text x="138" y="827" font-size="34" font-weight="700" fill="#059669">3</text><text x="225" y="805" font-size="29" font-weight="700" fill="#0F172A">Convert and download</text><text x="225" y="845" font-size="23" fill="#64748B">Done. No hidden steps.</text></g><text x="80" y="980" font-family="Arial,sans-serif" font-size="25" fill="#475569">www.pixconvertly.site</text></svg>